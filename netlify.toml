[build]
  publish = "build/web"
  command = """
  curl -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.27.4-stable.tar.xz -o flutter.tar.xz &&
  tar xf flutter.tar.xz &&
  export PATH="$PWD/flutter/bin:$PATH" &&
  flutter --version &&
  flutter pub get &&
  flutter build web --release
  """

[functions]
  directory = "netlify/functions"