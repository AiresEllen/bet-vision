<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bet Vision - painel de análise esportiva com foco em leitura de jogos e score de confiança.">
  <meta name="theme-color" content="#07111A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bet Vision">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Bet Vision</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #07111A;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .app-loader {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: radial-gradient(circle at top, #12301f, #07111A 65%);
    }

    .app-loader__badge {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(135deg, #15C26B, #6FE8FF);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #07111A;
      font-size: 34px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .app-loader__title {
      font-size: 20px;
      font-weight: 700;
    }

    .app-loader__subtitle {
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app-loader">
    <div class="app-loader__badge">BV</div>
    <div class="app-loader__title">Bet Vision</div>
    <div class="app-loader__subtitle">Carregando painel de análise...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
